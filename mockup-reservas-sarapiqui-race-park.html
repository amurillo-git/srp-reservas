    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

    #srp-booking-mockup {

    #srp-booking-mockup * { box-sizing: border-box; }

      border: 1px solid var(--srp-border);
      border-radius: 18px;

      padding: 14px 20px;

      background: var(--srp-navy);

    #srp-booking-mockup .srp-brand {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 220px;

    #srp-booking-mockup .srp-mark {

    #srp-booking-mockup .srp-steps {
      display: grid;
      grid-template-columns: repeat(3, 1fr);

    }

    #srp-booking-mockup .srp-step {
      padding-top: 9px;
      border-top: 3px solid var(--srp-border);
      color: var(--srp-muted);
    }

    #srp-booking-mockup .srp-step.is-current {

              &lt;div class=&quot;srp-agenda-row&quot;&gt;&lt;div class=&quot;srp-agenda-time&quot;&gt;9:30&lt;/div&gt;&lt;div class=&quot;srp-agenda-event&quot;&gt;&lt;strong&gt;Heat · 3 de 5 espacios&lt;/strong&gt;&lt;span&gt;SRP-0151 · segundo heat de 6 personas&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
              &lt;div class=&quot;srp-agenda-row&quot;&gt;&lt;div class=&quot;srp-agenda-time&quot;&gt;9:45&lt;/div&gt;&lt;div class=&quot;srp-agenda-event clean&quot;&gt;&lt;strong&gt;Limpieza y preparación&lt;/strong&gt;&lt;span&gt;Cierre del lote operativo&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
              &lt;div class=&quot;srp-agenda-row&quot;&gt;&lt;div class=&quot;srp-agenda-time&quot;&gt;10:00&lt;/div&gt;&lt;div class=&quot;srp-agenda-event available&quot;&gt;&lt;strong&gt;Disponible&lt;/strong&gt;&lt;span&gt;Puede iniciar un nuevo lote&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
              &lt;div id=&quot;srp-block-row&quot; class=&quot;srp-agenda-row&quot;&gt;&lt;div class=&quot;srp-agenda-time&quot;&gt;10:15&lt;/div&gt;&lt;div class=&quot;srp-agenda-event available&quot;&gt;&lt;strong&gt;Disponible&lt;/strong&gt;&lt;span&gt;Sin reservas&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
              &lt;div class=&quot;srp-agenda-row&quot;&gt;&lt;div class=&quot;srp-agenda-time&quot;&gt;12:00&lt;/div&gt;&lt;div class=&quot;srp-agenda-event blocked&quot;&gt;&lt;strong&gt;Almuerzo&lt;/strong&gt;&lt;span&gt;No admite heats ni limpieza · 12:00 a 12:30&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;

          &lt;aside class=&quot;srp-queue&quot; aria-labelledby=&quot;srp-queue-title&quot;&gt;
            &lt;div class=&quot;srp-queue-head&quot;&gt;&lt;h3 id=&quot;srp-queue-title&quot;&gt;SINPE por validar&lt;/h3&gt;&lt;span class=&quot;srp-status&quot;&gt;2 pendientes&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;srp-queue-item&quot;&gt;
              &lt;div class=&quot;srp-queue-code&quot;&gt;&lt;strong&gt;SRP-0154&lt;/strong&gt;&lt;span&gt;8 personas&lt;/span&gt;&lt;/div&gt;
              &lt;p&gt;Domingo · 10:30 a. m. · comprobante recibido&lt;/p&gt;

                &lt;button class=&quot;srp-secondary srp-approve&quot; type=&quot;button&quot;&gt;Aprobar&lt;/button&gt;
                &lt;button class=&quot;srp-link-button&quot; type=&quot;button&quot;&gt;Revisar&lt;/button&gt;
              &lt;/div&gt;
            &lt;/div&gt;
            &lt;div class=&quot;srp-queue-item&quot;&gt;
              &lt;div class=&quot;srp-queue-code&quot;&gt;&lt;strong&gt;SRP-0156&lt;/strong&gt;&lt;span&gt;4 personas&lt;/span&gt;&lt;/div&gt;
              &lt;p&gt;Sábado · 2:00 p. m. · comprobante recibido&lt;/p&gt;
              &lt;div class=&quot;srp-queue-actions&quot;&gt;
                &lt;button class=&quot;srp-secondary srp-approve&quot; type=&quot;button&quot;&gt;Aprobar&lt;/button&gt;
                &lt;button class=&quot;srp-link-button&quot; type=&quot;button&quot;&gt;Revisar&lt;/button&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;srp-booking-mockup&#x27;);
      const publicButton = root.querySelector(&#x27;#srp-public-button&#x27;);
      const adminButton = root.querySelector(&#x27;#srp-admin-button&#x27;);
      const publicView = root.querySelector(&#x27;#srp-public-view&#x27;);
      const adminView = root.querySelector(&#x27;#srp-admin-view&#x27;);
      const partyInput = root.querySelector(&#x27;#srp-party-size&#x27;);
      const dateSelect = root.querySelector(&#x27;#srp-date-select&#x27;);
      const timeSelect = root.querySelector(&#x27;#srp-time-select&#x27;);
      const timeline = root.querySelector(&#x27;#srp-timeline&#x27;);
      const timeHelp = root.querySelector(&#x27;#srp-time-help&#x27;);
      const peopleSummary = root.querySelector(&#x27;#srp-summary-people&#x27;);
      const heatsSummary = root.querySelector(&#x27;#srp-summary-heats&#x27;);
      const durationSummary = root.querySelector(&#x27;#srp-summary-duration&#x27;);
      const sideDate = root.querySelector(&#x27;#srp-side-date&#x27;);
      const sideTime = root.querySelector(&#x27;#srp-side-time&#x27;);
      const reserveMessage = root.querySelector(&#x27;#srp-reserve-message&#x27;);

      const availabilityStatus = root.querySelector(&#x27;#srp-availability-status&#x27;);
      const reserveButton = root.querySelector(&#x27;#srp-reserve-button&#x27;);
      const openPeriods = [[540, 720], [750, 960]];
      const schedules = {
        &#x27;2026-09-19&#x27;: [],
        &#x27;2026-09-20&#x27;: [{ start: 555, end: 600 }],
        &#x27;2026-10-12&#x27;: [{ start: 600, end: 660 }]
      };
      const dateLabels = {
        &#x27;2026-09-19&#x27;: &#x27;19 sep 2026&#x27;,
        &#x27;2026-09-20&#x27;: &#x27;20 sep 2026&#x27;,
        &#x27;2026-10-12&#x27;: &#x27;12 oct 2026&#x27;
      };
      let currentPlans = new Map();

      function minutesToLabel(total) {
        if (total &lt; 60) return `${total} minutos`;
        const hours = Math.floor(total / 60);
        const minutes = total % 60;
        return minutes ? `${hours} h ${minutes} min` : `${hours} hora${hours &gt; 1 ? &#x27;s&#x27; : &#x27;&#x27;}`;
      }

      function formatTime(totalMinutes) {
        const hours24 = Math.floor(totalMinutes / 60);
        const minutes = totalMinutes % 60;
        const suffix = hours24 &lt; 12 ? &#x27;a. m.&#x27; : &#x27;p. m.&#x27;;
        const hours12 = hours24 % 12 || 12;
        return `${hours12}:${String(minutes).padStart(2, &#x27;0&#x27;)} ${suffix}`;
      }

      function balancedDistribution(people) {
        const heats = Math.ceil(people / 5);
        const base = Math.floor(people / heats);
        const remainder = people % heats;
        return Array.from({ length: heats }, (_, index) =&gt; base + (index &lt; remainder ? 1 : 0));
      }

      function isFreeSlot(start, date) {
        const insideOpenPeriod = openPeriods.some(([from, to]) =&gt; start &gt;= from &amp;&amp; start + 15 &lt;= to);
        if (!insideOpenPeriod) return false;
        return !(schedules[date] || []).some((item) =&gt; start &lt; item.end &amp;&amp; start + 15 &gt; item.start);
      }

      function freeRunLength(start, date) {
        let length = 0;
        for (let cursor = start; cursor &lt; 960 &amp;&amp; isFreeSlot(cursor, date); cursor += 15) length += 1;
        return length;
      }

      function canFitLot(start, heats, date) {
        for (let index = 0; index &lt; heats + 1; index += 1) {
          if (!isFreeSlot(start + index * 15, date)) return false;
        }
        return true;
      }

      function buildPlan(start, heats, date, maySplit) {
        if (canFitLot(start, heats, date)) {
          return { lots: [{ start, heats, activityEndsAt: start + heats * 15, releaseAt: start + (heats + 1) * 15 }] };
        }
        if (!maySplit || !isFreeSlot(start, date)) return null;

        const lots = [];
        let remaining = heats;
        let cursor = start;
        let firstLot = true;

        while (remaining &gt; 0) {
          let lotStart = cursor;
          if (!firstLot) {
            while (lotStart &lt; 960 &amp;&amp; freeRunLength(lotStart, date) &lt; 2) lotStart += 15;
          }
          const runLength = freeRunLength(lotStart, date);
          if (runLength &lt; 2) return null;
          const assignedHeats = Math.min(remaining, runLength - 1);
          lots.push({
            start: lotStart,
            heats: assignedHeats,
            activityEndsAt: lotStart + assignedHeats * 15,
            releaseAt: lotStart + (assignedHeats + 1) * 15
          });
          remaining -= assignedHeats;
          cursor = lotStart + (assignedHeats + 1) * 15;
          firstLot = false;
        }

        return { lots };
      }

      function availablePlans(people, date) {
        const heats = Math.ceil(people / 5);
        const plans = [];
        for (let start = 540; start &lt; 960; start += 15) {
          const plan = buildPlan(start, heats, date, people &gt; 15);
          if (plan) plans.push({ start, plan });
        }
        return plans;
      }

      function makeBlock(type, title, detail) {
        const item = document.createElement(&#x27;div&#x27;);
        item.className = `srp-time-block${type ? ` ${type}` : &#x27;&#x27;}`;
        item.innerHTML = `&lt;strong&gt;${title}&lt;/strong&gt;&lt;span&gt;${detail}&lt;/span&gt;`;
        return item;
      }

      function renderTimeline(people, plan) {
        timeline.innerHTML = &#x27;&#x27;;
        const distribution = balancedDistribution(people);

        if (!plan) {
          timeline.appendChild(makeBlock(&#x27;is-break&#x27;, &#x27;Sin disponibilidad&#x27;, &#x27;Probá otra fecha&#x27;));
          return;
        }

        if (distribution.length &gt; 8) {
          distribution.slice(0, 3).forEach((count, index) =&gt; {
            timeline.appendChild(makeBlock(&#x27;&#x27;, `Heat ${index + 1}`, `${count} personas`));
          });
          timeline.appendChild(makeBlock(&#x27;&#x27;, `+${distribution.length - 4} heats`, &#x27;Distribución equilibrada&#x27;));
          timeline.appendChild(makeBlock(&#x27;&#x27;, `Heat ${distribution.length}`, `${distribution.at(-1)} personas`));
        } else {
          let heatIndex = 0;
          plan.lots.forEach((lot, lotIndex) =&gt; {
            for (let index = 0; index &lt; lot.heats; index += 1) {
              timeline.appendChild(makeBlock(&#x27;&#x27;, `Heat ${heatIndex + 1}`, `${distribution[heatIndex]} personas`));
              heatIndex += 1;
            }
            if (lotIndex &lt; plan.lots.length - 1) {
              timeline.appendChild(makeBlock(&#x27;is-break&#x27;, &#x27;Pausa&#x27;, `Continúa ${formatTime(plan.lots[lotIndex + 1].start)}`));
            }
          });
        }
      }

      function updateSelectedPlan() {
        const people = Math.max(1, Math.min(120, Number.parseInt(partyInput.value || &#x27;1&#x27;, 10)));
        const selectedStart = Number(timeSelect.value);
        const plan = currentPlans.get(selectedStart) || null;
        const distribution = balancedDistribution(people);

        sideTime.textContent = plan ? formatTime(selectedStart) : &#x27;—&#x27;;
        heatsSummary.textContent = plan &amp;&amp; plan.lots.length &gt; 1
          ? `${distribution.length} en ${plan.lots.length} lotes`
          : `${distribution.length} consecutivo${distribution.length &gt; 1 ? &#x27;s&#x27; : &#x27;&#x27;}`;
        timeHelp.textContent = plan
          ? `Distribución equilibrada: ${distribution.join(&#x27; + &#x27;)} personas.${plan.lots.length &gt; 1 ? &#x27; La disponibilidad requiere una pausa entre lotes.&#x27; : &#x27;&#x27;}`
          : &#x27;No existe un bloque completo para esta cantidad de personas en la fecha seleccionada.&#x27;;
        renderTimeline(people, plan);
      }

      function updateAvailability() {
        const people = Math.max(1, Math.min(120, Number.parseInt(partyInput.value || &#x27;1&#x27;, 10)));
        partyInput.value = people;
        const date = dateSelect.value;
        const distribution = balancedDistribution(people);
        const choices = availablePlans(people, date);
        currentPlans = new Map(choices.map(({ start, plan }) =&gt; [start, plan]));
        timeSelect.innerHTML = choices.length
          ? choices.map(({ start }, index) =&gt; `&lt;option value=&quot;${start}&quot;${index === 0 ? &#x27; selected&#x27; : &#x27;&#x27;}&gt;${formatTime(start)}&lt;/option&gt;`).join(&#x27;&#x27;)
          : &#x27;&lt;option value=&quot;&quot; selected&gt;No hay horas disponibles&lt;/option&gt;&#x27;;
        timeSelect.disabled = choices.length === 0;
        reserveButton.disabled = choices.length === 0;
        availabilityStatus.textContent = choices.length ? &#x27;Disponible&#x27; : &#x27;Sin disponibilidad&#x27;;
        peopleSummary.textContent = String(people);
        durationSummary.textContent = minutesToLabel(distribution.length * 15);
        updateSelectedPlan();
        reserveMessage.textContent = &#x27;&#x27;;
      }

      function setView(view) {
        const isPublic = view === &#x27;public&#x27;;
        publicView.hidden = !isPublic;
        adminView.hidden = isPublic;
        publicButton.setAttribute(&#x27;aria-pressed&#x27;, String(isPublic));
        adminButton.setAttribute(&#x27;aria-pressed&#x27;, String(!isPublic));
      }

      publicButton.addEventListener(&#x27;click&#x27;, () =&gt; setView(&#x27;public&#x27;));
      adminButton.addEventListener(&#x27;click&#x27;, () =&gt; setView(&#x27;admin&#x27;));
      partyInput.addEventListener(&#x27;input&#x27;, updateAvailability);
      dateSelect.addEventListener(&#x27;change&#x27;, () =&gt; {
        sideDate.textContent = dateLabels[dateSelect.value];
        updateAvailability();
      });
      timeSelect.addEventListener(&#x27;change&#x27;, updateSelectedPlan);
      reserveButton.addEventListener(&#x27;click&#x27;, () =&gt; {
        reserveMessage.textContent = &#x27;Vista de ejemplo: al continuar se solicitarían los datos y comenzaría la retención de 30 minutos.&#x27;;
      });
      root.querySelectorAll(&#x27;.srp-approve&#x27;).forEach((button) =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          const actions = button.parentElement;
          actions.innerHTML = &#x27;&lt;span class=&quot;srp-approved&quot;&gt;Depósito aprobado · reserva confirmada&lt;/span&gt;&#x27;;
        });
      });
      root.querySelector(&#x27;#srp-block-button&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        const event = root.querySelector(&#x27;#srp-block-row .srp-agenda-event&#x27;);
        event.className = &#x27;srp-agenda-event blocked&#x27;;
        event.innerHTML = &#x27;&lt;strong&gt;Bloqueo administrativo&lt;/strong&gt;&lt;span&gt;Evento privado · 10:15 a 11:00&lt;/span&gt;&#x27;;
      });

      updateAvailability();
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };

    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);
    document.removeEventListener(&quot;pointercancel&quot;, handlePointer);
    document.removeEventListener(&quot;click&quot;, handleTouchClick);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
